<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bubble Pop</title>
<style>
:root{--panel:#16365a;--acc:#ffd166}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:linear-gradient(#bfe6ff,#e9f7ff 60%,#fdf2ff);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#gear{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;width:48px;height:48px;border-radius:50%;border:0;background:#ffffffaa;font-size:1.4rem;cursor:pointer;opacity:.55;touch-action:none}
#gear svg{position:absolute;inset:-3px;width:54px;height:54px;transform:rotate(-90deg);pointer-events:none}
#gear circle{fill:none;stroke:#16365a;stroke-width:3;stroke-dasharray:157;stroke-dashoffset:157}
#gear.hold circle{stroke-dashoffset:0;transition:stroke-dashoffset 1.5s linear}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov.on{display:flex}
.card{background:var(--panel);color:#fff;border-radius:22px;padding:22px;width:min(420px,100%);max-height:100%;overflow:auto}
.card h2{margin:0 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.val{min-width:24px;text-align:right;font-weight:700}
.note{color:#9fb6d0;font-size:.88rem;margin:2px 0 0}
.pri{background:var(--acc);color:#222;border:0;border-radius:14px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="gear" aria-label="Parent settings (hold)">⚙️<svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="25"/></svg></button>

<div class="ov" id="set"><div class="card">
  <h2>Parent settings</h2>
  <p class="note">Hold the ⚙️ button for 1.5 seconds to open this panel.</p>
  <div class="row"><label for="n">Bubbles on screen</label><input type="range" id="n" min="2" max="15"><span class="val" id="nv"></span></div>
  <div class="row"><label for="sz">Bubble size</label><input type="range" id="sz" min="1" max="3"><span class="val" id="szv"></span></div>
  <div class="row"><label for="sp">Float speed</label><input type="range" id="sp" min="1" max="3"><span class="val" id="spv"></span></div>
  <div class="row"><label for="say">Say color names</label><input type="checkbox" id="say"></div>
  <div class="row"><label for="show">Show names on screen</label><input type="checkbox" id="show"></div>
  <div class="row"><label for="snd">Sound</label><input type="checkbox" id="snd"></div>
  <div class="row"><label for="vib">Vibrate on pop</label><input type="checkbox" id="vib"></div>
  <button class="pri" id="done">Done</button>
</div></div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const COLORS=['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#9775fa','#f783ac','#a9744f'];
const NAMES=['Red','Orange','Yellow','Green','Blue','Purple','Pink','Brown'];
const SIZES=[[.07,.11],[.1,.16],[.14,.22]],SPEEDS=[.06,.1,.16];
const LBL=['Small','Medium','Large'],SLBL=['Slow','Medium','Fast'];
let S={n:6,sz:2,sp:1,snd:true,vib:false,say:true,show:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('bubblePop')||'{}'))}catch(e){}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,Math.round(+v)||a));
S.n=clamp(S.n,2,15);S.sz=clamp(S.sz,1,3);S.sp=clamp(S.sp,1,3);
function save(){try{localStorage.setItem('bubblePop',JSON.stringify(S))}catch(e){}}
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

let W,H,M,dpr,bubbles=[],parts=[],rings=[],labels=[],ac=null,last=0;
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;M=Math.min(W,H);
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
}
function mk(initial){
  const [a,b]=SIZES[S.sz-1],r=M*(a+Math.random()*(b-a));
  return{r,x:r+Math.random()*(W-2*r),y:initial?Math.random()*H:H+r+Math.random()*H*.4,
    ph:Math.random()*6.28,sw:M*(.01+Math.random()*.02),sv:.6+Math.random()*.8,
    v:M*SPEEDS[S.sp-1]*(.8+Math.random()*.5),c:COLORS[Math.random()*COLORS.length|0],t:0};
}
function fill(){bubbles=[];for(let i=0;i<S.n;i++)bubbles.push(mk(true))}

function say(t){ // spoken name, uses the device's built-in voice
  if(!S.say||!('speechSynthesis' in window))return;
  try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;u.pitch=1.2;
    speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function pop(x,y,r,c,quiet){
  const n=reduce?5:12;
  for(let i=0;i<n;i++){const a=i/n*6.28+Math.random()*.4,v=M*(.25+Math.random()*.35);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:M*(.012+Math.random()*.014),c,l:0})}
  rings.push({x,y,r:r*.9,c,l:0});
  if(quiet)return;
  const nm=NAMES[COLORS.indexOf(c)];say(nm);
  if(S.show)labels.push({x,y,s:nm,c,l:0});
  if(S.snd)try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime,f=520+Math.random()*420;
    o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.35,t+.14);
    g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.17)}catch(e){}
  if(S.vib)try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
}
function tap(x,y){
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i],bx=b.dx??b.x; // drawn (swayed) position
    if(Math.hypot(x-bx,y-b.y)<=b.r*1.12){ // slightly generous hit area
      pop(bx,b.y,b.r,b.c);bubbles[i]=mk(false);return;
    }
  }
  rings.push({x,y,r:M*.03,c:'#ffffff',l:0}); // empty tap: soft ripple, no sound
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY)});
cv.addEventListener('contextmenu',e=>e.preventDefault());

function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  ctx.clearRect(0,0,W,H);
  for(const b of bubbles){
    b.y-=b.v*dt;b.t+=dt;
    const x=b.x+Math.sin(b.ph+b.t*b.sv)*b.sw;
    if(b.y<-b.r*1.2){Object.assign(b,mk(false))}
    const g=ctx.createRadialGradient(x-b.r*.3,b.y-b.r*.3,b.r*.1,x,b.y,b.r);
    g.addColorStop(0,b.c+'55');g.addColorStop(.75,b.c+'99');g.addColorStop(1,b.c+'dd');
    ctx.beginPath();ctx.arc(x,b.y,b.r,0,6.283);ctx.fillStyle=g;ctx.fill();
    ctx.lineWidth=Math.max(2,b.r*.04);ctx.strokeStyle='#ffffffcc';ctx.stroke();
    ctx.beginPath();ctx.ellipse(x-b.r*.38,b.y-b.r*.42,b.r*.22,b.r*.12,-.7,0,6.283);
    ctx.fillStyle='#ffffffcc';ctx.fill();
    b.dx=x; // keep drawn x for hit-testing
  }
  for(let i=rings.length-1;i>=0;i--){
    const q=rings[i];q.l+=dt;const k=q.l/.4;
    if(k>=1){rings.splice(i,1);continue}
    ctx.globalAlpha=1-k;ctx.beginPath();ctx.arc(q.x,q.y,q.r*(1+k*.5),0,6.283);
    ctx.lineWidth=M*.008;ctx.strokeStyle=q.c;ctx.stroke();
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.l+=dt;const k=p.l/.55;
    if(k>=1){parts.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=M*.5*dt;
    ctx.globalAlpha=1-k;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1-k*.5),0,6.283);
    ctx.fillStyle=p.c;ctx.fill();
  }
  for(let i=labels.length-1;i>=0;i--){ // name pops up where it was caught, then fades
    const q=labels[i];q.l+=dt;const k=q.l/1.4;
    if(k>=1){labels.splice(i,1);continue}
    const sc=.6+.4*Math.min(1,q.l/.15),fs=M*.1*sc;
    ctx.save();ctx.globalAlpha=k<.7?1:1-(k-.7)/.3;
    ctx.font=`800 ${fs}px "Trebuchet MS","Segoe UI",system-ui,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    const w=ctx.measureText(q.s).width/2+fs*.2,x=Math.min(W-w,Math.max(w,q.x)),y=q.y-(reduce?0:k*M*.08);
    ctx.lineJoin='round';ctx.lineWidth=fs*.22;ctx.strokeStyle='#16365a';ctx.strokeText(q.s,x,y);
    ctx.fillStyle=q.c;ctx.fillText(q.s,x,y);ctx.restore();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
// Parent settings: hold the gear for 1.5s
let holdT=null;const gear=$('gear');
function holdStart(e){e.preventDefault();gear.classList.add('hold');holdT=setTimeout(()=>{holdEnd();openSet()},1500)}
function holdEnd(){clearTimeout(holdT);gear.classList.remove('hold')}
gear.addEventListener('pointerdown',holdStart);
['pointerup','pointerleave','pointercancel'].forEach(t=>gear.addEventListener(t,holdEnd));
function upd(){
  $('nv').textContent=$('n').value;$('szv').textContent=LBL[$('sz').value-1];$('spv').textContent=SLBL[$('sp').value-1];
}
function openSet(){
  $('n').value=S.n;$('sz').value=S.sz;$('sp').value=S.sp;$('snd').checked=S.snd;$('vib').checked=S.vib;$('say').checked=S.say;$('show').checked=S.show;
  upd();$('set').classList.add('on');
}
['n','sz','sp'].forEach(id=>$(id).oninput=upd);
$('done').onclick=()=>{
  S.n=clamp($('n').value,2,15);S.sz=clamp($('sz').value,1,3);S.sp=clamp($('sp').value,1,3);
  S.snd=$('snd').checked;S.vib=$('vib').checked;S.say=$('say').checked;S.show=$('show').checked;save();
  $('set').classList.remove('on');fill();
};
addEventListener('resize',()=>{resize();fill()});
resize();fill();requestAnimationFrame(frame);
</script>
<a href="../index.html" aria-label="Home" style="position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;width:48px;height:48px;border-radius:50%;background:#ffffffaa;display:flex;align-items:center;justify-content:center;font-size:1.4rem;text-decoration:none;opacity:.55;z-index:4">🏠</a>
</body>
</html>
