<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Animal Friends</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:linear-gradient(#c9f2c7,#e9f9d9 60%,#fff8d6);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#say{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:2.6rem;font-weight:800;color:#16365a;height:60px;pointer-events:none}
#grid{position:fixed;inset:0;padding:calc(84px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:14px;max-width:720px;margin:0 auto}
@media(min-width:600px){#grid{grid-template-columns:repeat(4,1fr)}}
.an{border:0;border-radius:26px;background:#fff;box-shadow:0 7px 0 #0002;font-size:min(22vw,6.5rem);display:flex;align-items:center;justify-content:center;touch-action:manipulation;cursor:pointer}
.an.b{animation:bounce .5s}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-6deg)}60%{transform:scale(.95) rotate(5deg)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="say"></div>
<div id="grid"></div>
<a href="../index.html" aria-label="Home" style="position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;width:48px;height:48px;border-radius:50%;background:#ffffffaa;display:flex;align-items:center;justify-content:center;font-size:1.4rem;text-decoration:none;opacity:.55;z-index:4">🏠</a>
<script>
const animals=[
  ['🐮','Moo!','#ffe0e0'],['🐶','Woof!','#ffeccc'],['🐱','Meow!','#e8e0ff'],['🐑','Baa!','#e6f0ff'],
  ['🐷','Oink!','#ffe0f0'],['🐸','Ribbit!','#dff7d9'],['🦆','Quack!','#fff6c4'],['🐴','Neigh!','#f3e4d6']
];
const grid=document.getElementById('grid'),say=document.getElementById('say');
let timer;
function speak(t){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t.replace('!',''));
    u.rate=.8;u.pitch=1.5;u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
animals.forEach(([em,snd,bg])=>{
  const b=document.createElement('button');
  b.className='an';b.textContent=em;b.style.background=bg;
  b.setAttribute('aria-label',snd);
  b.addEventListener('pointerdown',()=>{
    b.classList.remove('b');void b.offsetWidth;b.classList.add('b');
    say.textContent=snd;clearTimeout(timer);
    timer=setTimeout(()=>say.textContent='',1500);
    speak(snd);
  });
  grid.appendChild(b);
});
</script>
</body>
</html>
